services:
  app:
    build: .
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    # npm ci alinea node_modules del volumen con package-lock (evita faltar recharts u otras deps nuevas)
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  app_node_modules:
