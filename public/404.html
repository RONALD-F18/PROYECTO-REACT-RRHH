<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Redirigiendo…</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\//, '');
        var destino = '/#/' + path;
        if (!path) destino = '/#/';
        window.location.replace(destino);
      })();
    </script>
  </head>
  <body></body>
</html>
